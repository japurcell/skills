<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Factory observatory</title>
  <script>(function(){const p=new URLSearchParams(location.hash.slice(1));const ticket=p.get('handoff');p.delete('handoff');history.replaceState(null,'',location.pathname+location.search+(p.size?'#'+p:''));import('/assets/app.js').then(m=>m.start(ticket)).catch(()=>{document.getElementById('app').textContent='History unavailable. Reload the dashboard from its owner process.'})})()</script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#">Factory observatory</a>
    <span id="connection" class="connection" role="status" aria-live="polite">Connecting</span>
  </header>
  <main id="app" tabindex="-1" aria-busy="true"><p class="state-message">Loading saved history</p></main>
  <div id="announcement" class="screen-reader-only" aria-live="polite"></div>
</body>
</html>
