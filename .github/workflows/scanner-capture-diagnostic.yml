name: Scanner capture diagnostic

# Focused reproduction only. Full native release workflows remain required.
on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'hooks/**'
      - '.codex/hooks/**'
      - '.copilot/hooks/scripts/**'
      - '.gemini/hooks/scripts/**'
      - 'scripts/test-scan-secrets-windows.ps1'
      - 'scripts/test-lifecycle-messages-windows.ps1'
      - '.github/workflows/scanner-capture-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install stable Rust Token Killer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id rtk-ai.rtk --exact --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw 'Stable RTK installation failed.' }
          $rtkCommand = Get-Command rtk -CommandType Application -ErrorAction Stop | Select-Object -First 1
          Split-Path -Parent $rtkCommand.Source >> $env:GITHUB_PATH
          & $rtkCommand.Source --version
          if ($LASTEXITCODE -ne 0) { throw 'RTK is unavailable.' }
      - name: Check generated hooks
        run: rtk proxy python scripts/generate-hooks.py --check
      - name: Reproduce native scanner capture
        shell: pwsh
        run: rtk proxy pwsh -NoProfile -File scripts/test-scan-secrets-windows.ps1
      - name: Test lifecycle scanner envelopes
        shell: pwsh
        run: rtk proxy pwsh -NoProfile -File scripts/test-lifecycle-messages-windows.ps1
