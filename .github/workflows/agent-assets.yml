name: Agent assets platform acceptance

on:
  push:
    paths:
      - 'scripts/**'
      - 'distribution/**'
      - 'hooks/**'
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'skills/**'
      - 'agents/**'
      - '.agents/skills/**'
      - 'LICENSE*'
      - '.github/workflows/agent-assets.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'distribution/**'
      - 'hooks/**'
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'skills/**'
      - 'agents/**'
      - '.agents/skills/**'
      - 'LICENSE*'
      - '.github/workflows/agent-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX public suite (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check source freshness separately from installed payload
        run: python scripts/generate-hooks.py --check
      - name: Run every public installer case
        run: python scripts/test-agent-assets.py

  payload:
    name: Commit portable payload once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Export real installed commit with independent literal fixtures
        run: python scripts/test-agent-assets.py --export-clone-bundle payload.bundle
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: committed-agent-assets
          path: payload.bundle
          if-no-files-found: error

  clone:
    name: Read-only clone audit and launchers (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: committed-agent-assets
      - name: Audit before any repair with autocrlf true and false; execute relocated launchers
        env:
          AGENT_ASSETS_CLONE_BUNDLE: ${{ github.workspace }}/payload.bundle
        run: python scripts/test-agent-assets.py --group clone
      - name: Verify native Windows mutation refusal and recovery evidence
        if: runner.os == 'Windows'
        run: python scripts/test-agent-assets.py --group windows-boundary

  windows-mutation:
    # Intentionally remains a failing acceptance gate while production mutation
    # refuses Windows. Clone/refusal success must never imply writer support.
    name: UNMET native Windows mutation acceptance (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run complete existing public suite without suppressing unsupported writes
        run: python scripts/test-agent-assets.py
