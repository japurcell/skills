name: Windows notification helper native qualification

on:
  push:
    paths:
      - 'packages/software-factory/native/windows-notify/**'
      - '.github/workflows/windows-notification-build.yml'
  pull_request:
    paths:
      - 'packages/software-factory/native/windows-notify/**'
      - '.github/workflows/windows-notification-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Compile helper and run TEMP-only registration ownership checks
        shell: pwsh
        env:
          FACTORY_BUILD_EVIDENCE: ${{ runner.temp }}/notification-build-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:FACTORY_BUILD_EVIDENCE | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio locator missing' }
          $candidates = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')
          if ($LASTEXITCODE -ne 0 -or $candidates.Count -eq 0) { throw 'MSBuild prerequisite missing' }
          $msbuild = $candidates[0]
          & $msbuild -version -nologo | Tee-Object -FilePath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'msbuild-version.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = Join-Path $env:GITHUB_WORKSPACE 'packages/software-factory/native/windows-notify/windows-notify.vcxproj'
          & $msbuild $project /p:Configuration=Release /p:Platform=x64 /m:1 /nologo /verbosity:minimal 2>&1 | Tee-Object -FilePath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'compile.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $env:GITHUB_WORKSPACE 'packages/software-factory/native/windows-notify/out/x64/windows-notify.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Expected helper artifact missing' }
          $hash = Get-FileHash -LiteralPath $binary -Algorithm SHA256
          @{ platform = 'win32-x64'; state = 'compiled_only'; sha256 = $hash.Hash.ToLowerInvariant(); bytes = (Get-Item -LiteralPath $binary).Length } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'artifact.json')
          Copy-Item -LiteralPath $binary -Destination (Join-Path $env:FACTORY_BUILD_EVIDENCE 'windows-notify.exe')
          $testProject = Join-Path $env:GITHUB_WORKSPACE 'packages/software-factory/native/windows-notify/registration-tests.vcxproj'
          & $msbuild $testProject /p:Configuration=Release /p:Platform=x64 /m:1 /nologo /verbosity:minimal 2>&1 | Tee-Object -FilePath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'registration-compile.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testBinary = Join-Path $env:GITHUB_WORKSPACE 'packages/software-factory/native/windows-notify/out/x64/windows-notify-registration-tests.exe'
          if (-not (Test-Path -LiteralPath $testBinary -PathType Leaf)) { throw 'Expected registration test artifact missing' }
          & $testBinary $env:RUNNER_TEMP 2>&1 | Tee-Object -FilePath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'registration-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ platform = 'win32-x64'; state = 'temp_registration_tests_passed'; helperSha256 = $hash.Hash.ToLowerInvariant(); visibleDelivery = 'unverified' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:FACTORY_BUILD_EVIDENCE 'native-tests.json')
      - name: Preserve native build and test evidence including failure
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-notification-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notification-build-evidence/
          if-no-files-found: error
          retention-days: 14
