name: Windows storage loader host bootstrap only

# Root must separately release the exact registration push. Dispatch requires
# registration/default-branch presence; this source does not perform that step.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/research-agentic-workflow-prototypes
    paths:
      - .github/workflows/windows-storage-loader-metadata.yml
      - packages/software-factory/qualification/windows-storage-loader-metadata-bootstrap.mjs

permissions:
  contents: read

concurrency:
  group: windows-storage-loader-host-bootstrap
  cancel-in-progress: false

jobs:
  host-bootstrap-only:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout separately selected workflow source without credentials
        timeout-minutes: 1
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch only the fixed official Node archive and authenticate node.exe
        timeout-minutes: 5
        env:
          FACTORY_PRIVATE_ROOT: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $private = [IO.Path]::Combine($env:FACTORY_PRIVATE_ROOT, 'factory-metadata-node-' + [Guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($private)
          $archivePath = [IO.Path]::Combine($private, 'node-v24.22.1-win-x64.zip')
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [Net.Http.HttpClient]::new($handler)
          $deadline = [Threading.CancellationTokenSource]::new(120000)
          $response = $null; $inputStream = $null; $outputStream = $null; $archiveStream = $null; $zip = $null; $sha = $null
          try {
            $response = $client.GetAsync('https://nodejs.org/download/release/v24.22.1/node-v24.22.1-win-x64.zip', [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $deadline.Token).GetAwaiter().GetResult()
            if ([int]$response.StatusCode -ne 200) { throw 'Fixed Node archive unavailable' }
            $inputStream = $response.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
            $outputStream = [IO.FileStream]::new($archivePath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            $buffer = [byte[]]::new(65536); $total = 0L
            while (($size = $inputStream.ReadAsync($buffer, 0, $buffer.Length, $deadline.Token).GetAwaiter().GetResult()) -ne 0) {
              $total += $size
              if ($total -gt 150000000) { throw 'Fixed Node archive bounds' }
              $outputStream.Write($buffer, 0, $size)
            }
            $outputStream.Dispose(); $outputStream = $null
            $archiveStream = [IO.FileStream]::new($archivePath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            $sha = [Security.Cryptography.SHA256]::Create()
            $archiveHash = ([BitConverter]::ToString($sha.ComputeHash($archiveStream))).Replace('-', '').ToLowerInvariant()
            if ($archiveHash -cne 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5') { throw 'Fixed Node archive integrity' }
            $archiveStream.Position = 0
            $zip = [IO.Compression.ZipArchive]::new($archiveStream, [IO.Compression.ZipArchiveMode]::Read, $true)
            if ($zip.Entries.Count -gt 4096) { throw 'Fixed Node archive entries' }
            $entries = @($zip.Entries | Where-Object { $_.FullName -ceq 'node-v24.22.1-win-x64/node.exe' })
            if ($entries.Count -ne 1 -or $entries[0].Length -lt 1 -or $entries[0].Length -gt 134217728) { throw 'Fixed Node executable entry' }
            # Extract only the authenticated executable into a fixed private leaf.
            $runtime = [IO.Path]::Combine($private, 'node-v24.22.1-win-x64')
            [void][IO.Directory]::CreateDirectory($runtime)
            $binary = [IO.Path]::Combine($runtime, 'node.exe')
            $nodeInput = $entries[0].Open()
            $nodeOutput = [IO.FileStream]::new($binary, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $nodeInput.CopyTo($nodeOutput) } finally { $nodeInput.Dispose(); $nodeOutput.Dispose() }
            $nodeStream = [IO.FileStream]::new($binary, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            try {
              $nodeHash = ([BitConverter]::ToString($sha.ComputeHash($nodeStream))).Replace('-', '').ToLowerInvariant()
              if ($nodeStream.Length -ne $entries[0].Length -or $nodeHash -cne 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5') { throw 'Fixed Node executable integrity' }
            } finally { $nodeStream.Dispose() }
            # Fixed source-created private leaf, never a PATH lookup or user input.
            [IO.File]::WriteAllText([IO.Path]::Combine($env:FACTORY_PRIVATE_ROOT, 'factory-metadata-node-location.txt'), $private, [Text.UTF8Encoding]::new($false))
          } finally {
            foreach ($resource in @($zip, $archiveStream, $outputStream, $inputStream, $response, $sha, $deadline, $client, $handler)) { if ($null -ne $resource) { $resource.Dispose() } }
          }
      - name: Observe fixed Windows host facts without invoking the metadata collector
        id: bootstrap
        timeout-minutes: 5
        env:
          FACTORY_PRIVATE_ROOT: ${{ runner.temp }}
          FACTORY_BOOTSTRAP_SOURCE_COMMIT: ${{ github.sha }}
          FACTORY_WINDOWS_LOADER_BOOTSTRAP_RELEASE: phase-a-observation-only
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $private = [IO.File]::ReadAllText([IO.Path]::Combine($env:FACTORY_PRIVATE_ROOT, 'factory-metadata-node-location.txt'))
          $parent = [IO.Path]::GetFullPath($env:FACTORY_PRIVATE_ROOT)
          if ([IO.Path]::GetDirectoryName($private) -cne $parent -or [IO.Path]::GetFileName($private) -cnotmatch '^factory-metadata-node-[0-9a-f]{32}$') { throw 'Private runtime location refused' }
          $binary = [IO.Path]::Combine($private, 'node-v24.22.1-win-x64', 'node.exe')
          $sha = [Security.Cryptography.SHA256]::Create()
          $stream = [IO.FileStream]::new($binary, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
          try {
            if ($stream.Length -gt 134217728 -or ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant() -cne 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5') { throw 'Selected Node integrity refused' }
          } finally { $stream.Dispose(); $sha.Dispose() }
          $wirePath = [IO.Path]::Combine($private, 'bootstrap.json')
          $stderrPath = [IO.Path]::Combine($private, 'stderr-private.txt')
          & $binary packages/software-factory/qualification/windows-storage-loader-metadata-bootstrap.mjs --bootstrap-only > $wirePath 2> $stderrPath
          if ($LASTEXITCODE -ne 0 -or [IO.FileInfo]::new($stderrPath).Length -ne 0 -or [IO.FileInfo]::new($wirePath).Length -gt 4096) { throw 'Host bootstrap refused' }
          if ($env:FACTORY_BOOTSTRAP_SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Source control context refused' }
          $upload = [IO.Path]::Combine($env:FACTORY_PRIVATE_ROOT, 'factory-metadata-bootstrap-upload')
          if ([IO.Directory]::Exists($upload)) { throw 'Artifact destination already exists' }
          [void][IO.Directory]::CreateDirectory($upload)
          # Controller exported only strictly validated closed wire after postflight.
          [IO.File]::WriteAllBytes([IO.Path]::Combine($upload, 'bootstrap.json'), [IO.File]::ReadAllBytes($wirePath))
          $control = '{"scope":"windows-storage-loader-metadata-execution-control","schema":1,"phase":"bootstrap-observation-only","sourceCommit":"222924947e2a9b4c24a1d7c3eddaa426b0d15403","bootstrapSourceCommit":"' + $env:FACTORY_BOOTSTRAP_SOURCE_COMMIT + '","selectionAuthority":false,"buildAuthority":false,"nativeAuthority":false,"collectorExecutionReleased":false}'
          [IO.File]::WriteAllText([IO.Path]::Combine($upload, 'control.json'), $control + [char]10, [Text.UTF8Encoding]::new($false))
      - name: Upload only bounded host observations and redacted control record
        if: success() && steps.bootstrap.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-storage-loader-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-metadata-bootstrap-upload/bootstrap.json
            ${{ runner.temp }}/factory-metadata-bootstrap-upload/control.json
          if-no-files-found: error
          retention-days: 14
