name: Windows factory startup helper qualification spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native-helpers:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      FACTORY_TARGET: win32-x64
      CI: 'true'
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Node 24.22.1 bootstrap
        timeout-minutes: 5
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/factory-windows-startup-evidence
        run: node packages/software-factory/scripts/qualification-bootstrap.mjs
      - name: Fetch and verify exact official Git and TypeScript archives
        timeout-minutes: 5
        env:
          WINDOWS_STARTUP_EVIDENCE: ${{ runner.temp }}/factory-windows-startup-evidence
        run: node packages/software-factory/qualification/windows-startup-artifacts.mjs
      - name: Run disposable debug trace matrix
        timeout-minutes: 12
        env:
          WINDOWS_STARTUP_EVIDENCE: ${{ runner.temp }}/factory-windows-startup-evidence
        run: node packages/software-factory/qualification/windows-startup-run.mjs
      - name: Retain structured evidence on success or failure
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: factory-windows-startup-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-windows-startup-evidence/
          if-no-files-found: error
          retention-days: 14
