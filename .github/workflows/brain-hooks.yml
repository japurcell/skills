name: Standalone brain hooks

on:
  push:
    paths: &brain_hook_paths
      - '.codex/hooks.json'
      - '.gemini/settings.json'
      - 'hooks/**'
      - '.github/hooks/**'
      - '.copilot/hooks/**'
      - '.gemini/hooks/**'
      - '.codex/hooks/**'
      - 'scripts/test-brain-hooks.py'
      - 'scripts/generate-hooks.py'
      - 'scripts/test-extract-conversations-windows-owner.py'
      - 'scripts/test-extract-conversations-windows-owner-portable.py'
      - 'skills/default/brain-install/**'
      - '.github/workflows/brain-hooks.yml'
  pull_request:
    paths: *brain_hook_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify generated outputs
        run: python scripts/generate-hooks.py --check
      - name: Exercise copied standalone scripts
        run: python scripts/test-brain-hooks.py
      - name: Observe Windows fixture owner and exercise brain installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python scripts/test-extract-conversations-windows-owner.py
          $factsExit = $LASTEXITCODE
          python -m unittest discover -s skills/default/brain-install/tests -p "test_*.py"
          $testsExit = $LASTEXITCODE
          if ($testsExit -ne 0) { exit $testsExit }
          exit $factsExit
      - name: Exercise portable brain installation
        if: runner.os != 'Windows'
        run: python -m unittest discover -s skills/default/brain-install/tests -p "test_*.py"
