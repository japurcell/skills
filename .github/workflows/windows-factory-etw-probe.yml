name: Windows factory ETW feasibility probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/research-agentic-workflow-prototypes
    paths:
      - .github/workflows/windows-factory-etw-probe.yml
      - packages/software-factory/qualification/windows-etw-probe*
      - packages/software-factory/qualification/windows-etw-child-fixture.cjs
      - packages/software-factory/qualification/windows-etw-held-native.qualification.mjs

permissions:
  contents: read

jobs:
  known-node-child-etw:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      FACTORY_TARGET: win32-x64
      CI: 'true'
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Node 24.22.1 bootstrap
        id: bootstrap
        timeout-minutes: 5
        shell: pwsh
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/factory-windows-etw-probe-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & node packages/software-factory/scripts/qualification-bootstrap.mjs *> $null
            if ($LASTEXITCODE -ne 0) { throw 'bootstrap-failed' }
          } catch {
            try {
              New-Item -ItemType Directory -Force -Path $env:FACTORY_EVIDENCE_DIR | Out-Null
              $receipt = '{"scope":"T17-Windows-ETW-native-feasibility-only","status":"failed","failure":{"stage":"bootstrap","code":"operation-failed"}}'
              [IO.File]::WriteAllText((Join-Path $env:FACTORY_EVIDENCE_DIR 'qualification.json'), $receipt + [Environment]::NewLine)
            } catch { }
            [Console]::Error.WriteLine('ETW bootstrap failed: bootstrap/operation-failed')
            exit 1
          }
      - name: Check ETW probe protocol
        timeout-minutes: 1
        run: node --test packages/software-factory/qualification/windows-etw-probe.test.mjs
      - name: Probe one owned ETW session and known non-debug Node child
        timeout-minutes: 12
        env:
          WINDOWS_ETW_PROBE_EVIDENCE: ${{ runner.temp }}/factory-windows-etw-probe-evidence
        run: node packages/software-factory/qualification/windows-etw-probe.mjs
      - name: Verify held fixture and reject a foreign same-Node child
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 2
        run: node packages/software-factory/qualification/windows-etw-held-native.qualification.mjs
      - name: Remove raw ETL before artifact upload
        id: remove_etl
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          $etl = Join-Path $env:RUNNER_TEMP 'factory-windows-etw-probe-evidence/trace.etl'
          if (Test-Path -LiteralPath $etl) { Remove-Item -LiteralPath $etl -Force -ErrorAction Stop }
      - name: Bound and validate receipts before upload
        id: artifact_guard
        if: always()
        timeout-minutes: 1
        env:
          WINDOWS_ETW_PROBE_EVIDENCE: ${{ runner.temp }}/factory-windows-etw-probe-evidence
        run: node packages/software-factory/qualification/windows-etw-probe.mjs --prepare-artifacts
      - name: Retain bounded probe receipts even on failure
        if: always() && steps.remove_etl.outcome == 'success' && steps.artifact_guard.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: factory-windows-etw-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-windows-etw-probe-evidence/upload/qualification.json
            ${{ runner.temp }}/factory-windows-etw-probe-evidence/upload/native.tsv
          if-no-files-found: warn
          retention-days: 14
