name: Ready ideas Windows hooks

on:
  push:
    paths:
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'hooks/**'
      - 'scripts/**'
      - '.github/workflows/ready-ideas-windows.yml'
  pull_request:
    paths:
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'hooks/**'
      - 'scripts/**'
      - '.github/workflows/ready-ideas-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install stable Rust Token Killer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id rtk-ai.rtk --exact --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw 'Stable RTK installation failed.' }
          $versionText = (& rtk --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionText -cnotmatch '^rtk (\d+\.\d+\.\d+)$') {
            throw "Expected stable Rust Token Killer on PATH, got: $versionText"
          }
          if ([version]$Matches[1] -lt [version]'0.50.0') {
            throw "RTK 0.50.0 or newer is required, got: $versionText"
          }
          $hookHelp = & rtk hook --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'RTK hook command is unavailable.' }
          foreach ($processor in @('copilot', 'gemini')) {
            if ($hookHelp -cnotmatch "(?m)^\s+$processor\s+") {
              throw "RTK hook processor is missing: $processor"
            }
          }
          Write-Output "Verified $versionText with Copilot and Gemini hook processors."
      - name: Check native prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('python', 'git', 'pwsh', 'rtk')) {
            Get-Command $name -CommandType Application -ErrorAction Stop | Out-Null
          }
      - name: Check generated hooks
        run: python scripts/generate-hooks.py --check
      - name: Test security banner envelopes
        run: python scripts/test-security-banners.py
      - name: Test native PowerShell installer
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-install.ps1
      - name: Test Codex scanner Windows envelopes
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-codex-hooks-windows.ps1
      - name: Test generated scanner capture on native Windows
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-scan-secrets-windows.ps1
      - name: Test stable RTK configuration on native Windows
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-rtk-stable-windows.ps1
      - name: Test repository OKF hooks on native Windows
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-repository-okf-windows.ps1
      - name: Test lifecycle messages on native Windows
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-lifecycle-messages-windows.ps1
