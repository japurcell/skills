name: Hook security POSIX

on:
  push:
    paths:
      - 'hooks/**'
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'scripts/**'
      - '.github/workflows/hooks-posix.yml'
  pull_request:
    paths:
      - 'hooks/**'
      - '.codex/**'
      - '.copilot/**'
      - '.gemini/**'
      - 'scripts/**'
      - '.github/workflows/hooks-posix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-linux:
    name: Native verifier cleanup Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Isolate native verifier fixtures
        run: |
          umask 077
          task_root="$RUNNER_TEMP/native verifier"
          mkdir -p "$task_root/home" "$task_root/tmp" "$task_root/logs"
          : > "$task_root/gitconfig"
          {
            printf 'HOME=%s/home\n' "$task_root"
            printf 'TMPDIR=%s/tmp\n' "$task_root"
            printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\n' "$task_root"
            printf 'GIT_CONFIG_NOSYSTEM=1\n'
            printf 'GIT_TERMINAL_PROMPT=0\n'
          } >> "$GITHUB_ENV"
      - name: Qualify actual Linux process identity and bounded cleanup
        run: |
          python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)'
          git --version
          uname -a
          python3 scripts/test-verify-security-fixture-patch.py 2>&1 | tee "$RUNNER_TEMP/native verifier/logs/verifier.log"
      - name: Retain Linux verifier evidence including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-verifier-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native verifier/logs
          if-no-files-found: warn
          retention-days: 14
  security:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          # Bootstrap RTK before using it for exact test commands.
          command -v brew
          brew update
          brew install git bash jq powershell rtk
          brew upgrade rtk
          for formula in git bash jq powershell rtk; do
            printf '%s/bin\n' "$(brew --prefix "$formula")" >> "$GITHUB_PATH"
          done
      - name: Provision real unsupported Python for negative fixtures
        uses: actions/setup-python@v7
        id: unsupported-python
        with:
          python-version: '3.11'
          update-environment: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare disposable test environment
        env:
          UNSUPPORTED_PYTHON: ${{ steps.unsupported-python.outputs.python-path }}
        run: |
          umask 077
          task_root="$RUNNER_TEMP/hook security"
          mkdir -p "$task_root/home" "$task_root/tmp" "$task_root/logs" "$task_root/config" "$task_root/data" "$task_root/cache" "$task_root/appdata" "$task_root/localappdata"
          : > "$task_root/gitconfig"
          {
            printf 'HOME=%s/home\n' "$task_root"
            printf 'USERPROFILE=%s/home\n' "$task_root"
            printf 'CODEX_HOME=%s/home/.codex\n' "$task_root"
            printf 'TMPDIR=%s/tmp\n' "$task_root"
            printf 'TMP=%s/tmp\n' "$task_root"
            printf 'TEMP=%s/tmp\n' "$task_root"
            printf 'APPDATA=%s/appdata\n' "$task_root"
            printf 'LOCALAPPDATA=%s/localappdata\n' "$task_root"
            printf 'XDG_CONFIG_HOME=%s/config\n' "$task_root"
            printf 'XDG_DATA_HOME=%s/data\n' "$task_root"
            printf 'XDG_CACHE_HOME=%s/cache\n' "$task_root"
            printf 'SECRETS_LOG_DIR=%s/logs/secrets\n' "$task_root"
            printf 'TOOL_GUARD_LOG_DIR=%s/logs/guardian\n' "$task_root"
            printf 'AUDIT_LOG=%s/logs/audit.log\n' "$task_root"
            printf 'OBSERVABILITY_LOG_PATH=%s/logs/observability.jsonl\n' "$task_root"
            printf 'OBSERVABILITY_TESTING=1\n'
            printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\n' "$task_root"
            printf 'TEST_UNSUPPORTED_PYTHON=%s\n' "$UNSUPPORTED_PYTHON"
            printf 'INSTALL_FOREST_SERVICE_SKILLS=\n'
            printf 'GIT_CONFIG_NOSYSTEM=1\n'
            printf 'GIT_TERMINAL_PROMPT=0\n'
          } >> "$GITHUB_ENV"
      - name: Provision verified Git LFS 3.8.0
        run: |
          case "$(uname -m)" in
            arm64)
              lfs_arch=arm64
              lfs_sha=caff76a7d070d8160c89bc39b6e85d98f24135b6fed038a3b4de2590d25102d8
              ;;
            x86_64)
              lfs_arch=amd64
              lfs_sha=f1c17aeca0b4eaab9ea606226477dbed3b84b56fe0811a9f967d2ea2b2393c53
              ;;
            *) printf 'Unsupported Darwin architecture for Git LFS fixture.\n' >&2; exit 1 ;;
          esac
          tool_root="$RUNNER_TEMP/hook security/tools/git-lfs-3.8.0"
          mkdir -p "$tool_root"
          archive="$tool_root/git-lfs-darwin-$lfs_arch-v3.8.0.zip"
          # Hashes and asset names are published by the official v3.8.0 release.
          rtk proxy curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-darwin-$lfs_arch-v3.8.0.zip"
          printf '%s  %s\n' "$lfs_sha" "$archive" | rtk proxy shasum -a 256 -c -
          rtk proxy /usr/bin/ditto -x -k "$archive" "$tool_root"
          lfs_bin="$tool_root/git-lfs-3.8.0/git-lfs"
          test -x "$lfs_bin"
          printf 'TEST_GIT_LFS=%s\n' "$lfs_bin" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$lfs_bin")" >> "$GITHUB_PATH"
          rtk proxy "$lfs_bin" version
          rtk proxy shasum -a 256 "$lfs_bin"
      - name: Verify native tools and stable RTK processors
        run: |
          for tool in python3 git bash jq pwsh git-lfs rtk; do
            command -v "$tool"
          done
          rtk proxy python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 13), "CI requires Python 3.13"'
          rtk proxy "$TEST_UNSUPPORTED_PYTHON" -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:2] == (3, 11), "Negative fixture requires real Python 3.11"'
          # This is the actual executable selected by the Darwin repository fixture.
          fixture_git=/Library/Developer/CommandLineTools/usr/bin/git
          test -x "$fixture_git"
          rtk proxy "$fixture_git" --version
          # The hosted Python package is root-owned but group-writable by default.
          # Installer fixtures require the same strict ancestry as real installs.
          rtk proxy sudo chmod go-w /Library/Frameworks/Python.framework/Versions \
            /Library/Frameworks/Python.framework/Versions/3.13 \
            /Library/Frameworks/Python.framework/Versions/3.13/bin \
            /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
          rtk proxy git --version
          rtk proxy bash --version
          rtk proxy jq --version
          rtk proxy pwsh -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $PSVersionTable.PSVersion.ToString(); if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 or newer is required." }'
          rtk proxy git lfs version
          rtk proxy python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          selected = Path(os.environ["TEST_GIT_LFS"])
          assert selected.is_absolute() and selected.is_file(), "TEST_GIT_LFS must select an absolute existing executable"
          assert Path(shutil.which("git-lfs")).resolve() == selected.resolve(), "PATH must select the verified Git LFS fixture"
          version = subprocess.check_output([str(selected), "version"], text=True).strip()
          assert version.startswith("git-lfs/3.8.0 "), f"Exact Git LFS 3.8.0 is required, got: {version}"
          print(f"Verified fixture {selected}: {version}")
          PYTHON
          rtk --version
          rtk gain
          rtk proxy python3 - <<'PYTHON'
          import re
          import subprocess
          version = subprocess.check_output(["rtk", "--version"], text=True).strip()
          match = re.fullmatch(r"rtk (\d+)\.(\d+)\.(\d+)", version)
          if match is None or tuple(map(int, match.groups())) < (0, 50, 0):
              raise SystemExit(f"Stable RTK >=0.50.0 is required, got: {version}")
          help_text = subprocess.check_output(["rtk", "hook", "--help"], text=True)
          for processor in ("copilot", "gemini"):
              if re.search(rf"^\s+{processor}\s+", help_text, re.MULTILINE) is None:
                  raise SystemExit(f"Required RTK hook processor is missing: {processor}")
          print(f"Verified {version} with Copilot and Gemini hook processors.")
          PYTHON
      - name: Check generated hooks
        run: rtk proxy python3 scripts/generate-hooks.py --check
      - name: Test generator behavior and closure
        run: rtk proxy python3 scripts/test-generate-hooks.py
      - name: Test maintained suite registry and runner
        run: rtk proxy python3 scripts/test_test_all.py
      - name: Test verification-only fixture preflight
        run: rtk proxy python3 scripts/test-verify-security-fixture-patch.py
      - name: Test diagnostic recovery
        run: rtk proxy python3 scripts/test-hook-diagnostic-recovery.py
      - name: Test security reporting
        run: rtk proxy python3 scripts/test-security-reporting.py
      # Each scanner shell already runs its provider's capture suite.
      - name: Test Codex scanner and capture
        run: |
          rtk proxy bash scripts/test-codex-hooks-secrets-scanner.sh 2>&1 | tee "$RUNNER_TEMP/hook security/logs/codex-scanner.log"
      - name: Test Copilot scanner and capture
        run: |
          rtk proxy bash scripts/test-hooks-secrets-scanner.sh 2>&1 | tee "$RUNNER_TEMP/hook security/logs/copilot-scanner.log"
      - name: Test Gemini scanner and capture
        run: |
          rtk proxy bash scripts/test-gemini-hooks-secrets-scanner.sh 2>&1 | tee "$RUNNER_TEMP/hook security/logs/gemini-scanner.log"
      - name: Require verified native Darwin capture evidence
        run: |
          rtk proxy python3 - <<'PYTHON'
          import errno
          import itertools
          import json
          import os
          from pathlib import Path
          import sys

          if sys.platform != "darwin":
              raise SystemExit("Native capture evidence requires Darwin.")
          def unique_fields(pairs):
              event = dict(pairs)
              if len(event) != len(pairs):
                  raise ValueError("Duplicate evidence field")
              return event

          prefix = "SCANNER_NATIVE_CAPTURE "
          required = set(itertools.product(("block", "warn"), ("clean", "findings")))
          for provider in ("codex", "copilot", "gemini"):
              log = Path(os.environ["RUNNER_TEMP"]) / "hook security" / "logs" / f"{provider}-scanner.log"
              observed = set()
              for line in log.read_text(encoding="utf-8").splitlines():
                  if not line.startswith(prefix):
                      continue
                  try:
                      event = json.loads(line[len(prefix):], object_pairs_hook=unique_fields)
                      expected = {"provider": provider, "mode": event["mode"],
                                  "status": event["status"], "native_errno": errno.EAGAIN,
                                  "soft_limit_restored": True, "post_lowering_hard_retained": True,
                                  "hard_limit_clamped": event["hard_limit_clamped"]}
                      case = (event["mode"], event["status"])
                      valid = (event == expected and type(event["native_errno"]) is int
                               and event["soft_limit_restored"] is True
                               and event["post_lowering_hard_retained"] is True
                               and type(event["hard_limit_clamped"]) is bool
                               and case in required and case not in observed)
                  except (ValueError, KeyError, TypeError):
                      valid = False
                  if not valid:
                      raise SystemExit(f"Invalid native capture evidence for {provider}.")
                  observed.add(case)
              if observed != required:
                  raise SystemExit(f"Missing native capture evidence for {provider}: {len(observed)}/4 cases.")
          print("Verified all 12 native Darwin capture cases with restored soft process limits.")
          PYTHON
      - name: Test checkpoint CLI
        run: rtk proxy python3 scripts/test-scan-secrets-cli.py
      - name: Test historical scan status
        run: rtk proxy python3 scripts/test-scan-secrets-status.py
      - name: Test actual Git commit and push gates
        run: rtk proxy python3 scripts/test-scan-secrets-git-gates.py
      - name: Test exact Git LFS upload and rejection
        run: rtk proxy python3 scripts/test-scan-secrets-lfs.py
      - name: Test repository gate installation and recovery
        run: rtk proxy python3 scripts/test-install-repo-gates.py
      - name: Test neutral scanner installation and upgrades
        run: rtk proxy python3 scripts/test-install-scan-secrets.py
      - name: Test provider lifecycle migration
        run: rtk proxy python3 scripts/test-scan-secrets-lifecycle.py
      - name: Test status cancellation and descendant cleanup
        run: rtk proxy python3 scripts/test-scan-status-cancellation.py
      - name: Test Codex configuration merger
        run: rtk proxy python3 scripts/test-install-codex-hooks.py
      - name: Test complete Bash installer
        run: rtk proxy bash scripts/test-install.sh
      - name: Test complete PowerShell installer on macOS
        run: rtk proxy pwsh -NoProfile -File scripts/test-install.ps1
      - name: Recheck generated hooks after complete suites
        run: rtk proxy python3 scripts/generate-hooks.py --check
