;margin-bottom:20px}.tools label{display:flex;align-items:center;gap:8px;font-size:12px}.stat,.status{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--edge);padding:3px 9px;border-radius:30px;font-size:12px;white-space:nowrap}.status{font-weight:650}.status.running{color:#9ac6ff;border-color:#416a9b}.status.passed{color:var(--green);border-color:#3b735b}.status.waiting,.status.interrupted{color:var(--amber);border-color:#8c7346}.status.failed{color:var(--rose);border-color:#8a4b61}.status.declared,.status.skipped{color:var(--muted)}.live-dot{width:7px;height:7px;border-radius:100%;background:var(--green);display:inline-block;margin-right:6px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.run-card{background:linear-gradient(145deg,#192536,#121c2a);border:1px solid var(--edge);border-radius:12px;overflow:hidden;min-width:0}.run-card.active{border-color:#6897c7}.card-head{padding:18px 19px 10px}.card-head a{display:block;font-size:17px;font-weight:700;text-decoration:none;color:var(--violet)}.card-head p{margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-head .recipe{color:var(--cyan);font:12px/1.7 ui-monospace,monospace;margin-top:4px}.mini{padding:10px 19px 16px}.mini-axis{margin-left:95px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.mini-row{display:grid;grid-template-columns:95px 1fr;align-items:center;min-height:31px;font-size:12px}.mini-row>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:7px}.mini-track{height:27px;border-bottom:1px solid #29374a;position:relative}.mark{position:absolute;top:10px;width:6px;height:6px;border-radius:100%;background:var(--cyan)}.mark.start{background:var(--violet)}.mark.end{background:var(--green)}.mini-empty{height:29px;color:#a7b4c7;font-size:11px;padding-top:8px}.card-foot{padding:12px 19px 17px;border-top:1px solid #29374a}.card-foot .wrap{gap:7px}.card-foot small{display:block;margin-top:8px}.run-head{display:flex;gap:15px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.run-head p{color:var(--muted);margin-top:7px;max-width:85ch}.run-head .metrics{margin-top:13px}.surface{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-top:18px}.section-head{padding:13px 17px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timeline-scroll{overflow:auto}.timeline{min-width:760px}.axis,.lane{display:grid;grid-template-columns:220px minmax(480px,1fr)}.axis{background:#1b293c;padding:10px 0;font-size:11px;color:var(--muted)}.axis>span{padding-left:18px}.ticks{display:flex;justify-content:space-between;padding-right:15px}.lane{min-height:108px;border-top:1px solid #2d3d52}.owner{padding:15px 18px;border-right:1px solid var(--edge);font-size:13px}.owner strong{display:block}.owner small{display:block;font-size:11px;margin-top:4px}.lane-track{position:relative;min-height:108px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(25% - 1px),#26354a calc(25% - 1px),#26354a 25%)}.phase{position:absolute;top:12px;min-height:80px;border:1px solid #5d8a96;background:#203f4a;color:var(--ink);border-radius:8px;padding:10px 11px;overflow:hidden;text-align:left;text-decoration:none;min-width:30px;display:block}.phase:hover{filter:brightness(1.17)}.phase.selected{outline:2px solid #a0ccff;outline-offset:3px}.phase strong,.phase small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phase small{font-size:11px;color:#d2dfeb}.phase .edge{font-size:10px;white-space:nowrap}.phase.violet{background:#363049;border-color:#8875b3}.phase.amber{background:#413b2b;border-color:#aa925c}.phase.rose{background:#482e3b;border-color:#ad6f86}.phase.green{background:#213e34;border-color:#609d7d}.activity-stripe{height:7px;display:flex;gap:3px;align-items:end;margin-top:8px;overflow:hidden}.activity-stripe i{display:block;width:2px;min-width:2px;height:6px;background:#c4dbe8}.future{padding:17px 20px;font-size:12px;color:var(--muted)}.legend{padding:12px 17px;font-size:11px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:minmax(280px,0.8fr) minmax(0,1.2fr)}.context{padding:18px;border-right:1px solid var(--edge)}details{border-bottom:1px solid var(--edge);padding:12px 0}summary{cursor:pointer;font-weight:600}.context details:first-child{padding-top:0}.context p{font-size:13px;margin-top:10px}.facts{display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px;font-size:12px;margin:13px 0 0}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.event-pane{min-width:0;padding:17px}.event-list{max-height:420px;overflow:auto;margin-top:12px}.event-row{display:grid;grid-template-columns:58px 120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid #2c3b50;font-size:12px}.event-row time{color:var(--muted);font-variant-numeric:tabular-nums}.event-row .kind{color:var(--cyan);font-family:ui-monospace,monospace}.event-row p{overflow-wrap:anywhere}.footnote{font-size:12px;color:var(--muted);padding:15px 0}.empty{padding:20px;color:var(--muted)}dialog{width:620px;max-width:calc(100vw - 32px);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid #7890b0;color:var(--ink);border-radius:12px;padding:22px}dialog::backdrop{background:#020913bb}dialog h2{margin-bottom:13px}dialog label{display:block;margin-top:14px}dialog .close{float:right}.note{padding:12px 0;border-bottom:1px solid var(--edge)}.note p{white-space:pre-wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1150px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.detail-grid{grid-template-columns:1fr}.context{border-right:0;border-bottom:1px solid var(--edge)}}
@media(max-width:650px){.cards{grid-template-columns:1fr}.top{padding:14px;align-items:flex-start}.brand{font-size:15px}.demo{padding:8px 14px}main{padding:18px 14px 50px}.run-head{display:block}.run-head>button{margin-top:12px}.tools{display:block}.tools>.wrap{margin-top:10px}.tools input{width:180px}.event-row{grid-template-columns:48px 95px minmax(0,1fr);gap:6px;font-size:11px}.stat{font-size:11px}.breadcrumb{gap:6px}.phase{padding:8px}.facts{grid-template-columns:85px 1fr}}

<body>
<div class="demo"><span>Design prototype · Synthetic saved events · Observability only; execution inputs belong in config or CLI arguments.</span><button id="notesButton">Prototype review notes <span id="notesCount">0</span></button></div>
<header class="top"><nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav><span id="liveState" class="stat"></span></header>
<main id="main"></main>
<dialog id="notesDialog" aria-labelledby="notesTitle"><button class="close" id="closeNotes">Close</button><h2 id="notesTitle">Prototype review notes</h2><p class="muted">Design feedback only. These notes never enter a workflow. Saved in this browser; export to share in chat.</p><label for="note">Comment on <strong id="noteContext"></strong><textarea id="note"></textarea></label><div class="wrap" style="margin-top:12px"><button id="saveNote">Save note</button><button id="exportNotes">Export Markdown</button></div><div id="notesList"></div></dialog>
<div id="announce" class="sr" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=s=>`<span class="status ${s}">${({running:'Running',passed:'Passed',waiting:'Waiting for CLI input',interrupted:'Interrupted',failed:'Failed',declared:'Declared',skipped:'Skipped'})[s]||s}</span>`;
const duration=s=>s<60?`${s}s`:`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
const phase=(id,title,owner,start,end,status='passed',color='',extra={})=>({id,title,owner,start,end,status,color,...extra});
const runs=[
 {id:'run-052',recipe:'saved_lists',title:'Add shared product lists',status:'running',elapsed:165,start:'Today 09:42',request:'Add saved product lists with owner-only updates. Implement the API and panel in isolated tasks. Review the combined diff before publication.',phases:[phase('request','Capture imported plan','request',0,6,'passed','amber'),phase('api','Implement list endpoints','api',6,95),phase('api-test','API unit tests','code',95,112,'passed','green'),phase('panel','Build saved-list panel','ui',6,null,'running'),phase('review-quality','Correctness review','quality',null,null,'declared','rose'),phase('review-security','Security review','security',null,null,'declared','violet')],owners:[['request','Engineer / request','Recorded CLI input'],['code','Code / workspace','Deterministic command'],['api','Builder / API task','Codex CLI · high'],['ui','Builder / UI task','Copilot CLI · high'],['quality','Reviewer / correctness','Codex CLI · high'],['security','Reviewer / security','Gemini CLI · profile-defined']],selected:'panel'},
 {id:'run-051',recipe:'review_and_repair',title:'Correct checkout sorting',status:'passed',elapsed:362,start:'Today 09:18',request:'Repair inconsistent sorting in checkout, then verify correctness and security. Preserve the prior failed review and its evidence.',phases:[phase('request','Capture request','request',0,5,'passed','amber'),phase('build','Implement sorting','builder',5,170),phase('tests','Run required checks','code',170,195,'passed','green'),phase('review-1','Review attempt 1','reviewer',195,238,'failed','rose',{attempt:1}),phase('repair','Repair stable ordering','builder',238,285),phase('tests-2','Recheck candidate','code',285,310,'passed','green'),phase('review-2','Review attempt 2','reviewer',310,355,'passed','rose',{attempt:2}),phase('report','Register report','code',355,362,'passed','green')],owners:[['request','Engineer / request','Recorded CLI input'],['code','Code / workspace','Deterministic command'],['builder','Builder / sorting task','Codex CLI · high'],['reviewer','Reviewer / correctness','Gemini CLI · profile-defined']],selected:'review-2'},
 {id:'run-050',recipe:'release_notes',title:'Review release notes for publication',status:'waiting',elapsed:94,start:'Today 09:05',request:'Generate release notes from accepted changes. Require human approval before creating a draft PR.',phases:[phase('request','Capture request','request',0,4,'passed','amber'),phase('write','Write release notes','writer',4,75,'passed','violet'),phase('check','Verify references','code',75,87,'passed','green'),phase('approval','Candidate approval','human',87,null,'waiting','amber')],owners:[['request','Engineer / request','Recorded CLI input'],['code','Code / workspace','Deterministic command'],['writer','Writer / release notes','Codex CLI · high'],['human','Human / checkpoint','Answer through CLI']],selected:'approval'},
 {id:'run-049',recipe:'accessibility_audit',title:'Audit checkout accessibility',status:'passed',elapsed:240,start:'Yesterday 16:20',request:'Produce a read-only accessibility report. Investigate keyboard navigation and semantics in parallel. Do not modify application code.',phases:[phase('request','Capture audit questions','request',0,8,'passed','amber'),phase('keyboard','Keyboard investigation','keyboard',8,170,'passed','violet'),phase('semantics','Semantics investigation','semantics',8,198),phase('report','Synthesize findings','writer',198,240,'passed','green')],owners:[['request','Engineer / request','Recorded CLI input'],['keyboard','Reviewer / keyboard','Codex CLI · high'],['semantics','Reviewer / semantics','Gemini CLI · profile-defined'],['writer','Writer / report','Codex CLI · high']],selected:'semantics'},
 {id:'run-048',recipe:'flaky_test_triage',title:'Diagnose a flaky checkout test',status:'passed',elapsed:220,start:'Yesterday 15:48',request:'Classify the failure and allow at most two repair iterations. Escalate infrastructure failures instead of editing code.',phases:[phase('sample','Sample failing test','code',0,30,'passed','green'),phase('classify','Select application branch','reasoner',30,56,'passed','violet'),phase('infra','Infrastructure branch','human',null,null,'skipped','amber'),phase('repair-1','Repair iteration 1','builder',56,110),phase('verify-1','Verify iteration 1','code',110,130,'failed','rose'),phase('repair-2','Repair iteration 2','builder',130,195),phase('verify-2','Verify iteration 2','code',195,220,'passed','green')],owners:[['code','Code / checks','Deterministic commands'],['reasoner','Reasoner / classification','Codex CLI · high'],['builder','Builder / repair loop','Copilot CLI · high'],['human','Human / infrastructure','Unselected branch']],selected:'verify-1'},
 {id:'run-047',recipe:'dependency_update',title:'Update the inventory client',status:'interrupted',elapsed:127,start:'Yesterday 14:32',request:'Update the inventory client and verify the consumer contract. Preserve partial changes if interrupted.',phases:[phase('request','Capture request','request',0,6,'passed','amber'),phase('update','Update client','builder',6,127,'interrupted','amber')],owners:[['request','Engineer / request','Recorded CLI input'],['builder','Builder / client','Codex CLI · high']],selected:'update'}
];
const outputRecords=[];let seq=0,tick=0,viewFrozen=false,frozenTick=0,view='index',runId=runs[0].id,phaseId=null,query='',statusFilter='all';let notes=[];
try{notes=JSON.parse(localStorage.getItem('factory-observatory-review-v1')||'[]');if(!Array.isArray(notes))notes=[];}catch{notes=[];}
function appendEvent(run,p,time,kind,message){outputRecords.push({seq:++seq,run:run.id,phase:p.id,time,kind,message,tick:0});}
for(const run of runs)for(const p of run.phases){if(p.start===null)continue;appendEvent(run,p,p.start,'phase_start',p.title);appendEvent(run,p,p.start+1,'config',`Effective settings captured for ${p.owner}; immutable input references recorded.`);if(p.end!==null){appendEvent(run,p,Math.max(p.start+2,p.end-2),'output',p.status==='failed'?'Required criterion failed: ordering changes when values are equal.':'Result summary and registered evidence are available.');appendEvent(run,p,p.end,p.status==='interrupted'?'interrupted':'phase_end',p.status==='failed'?'Blocking result preserved. A later attempt does not rewrite it.':p.status==='interrupted'?'Foreground runner exited unexpectedly. Outcome needs reconciliation.':'Outcome recorded: '+p.status);}else if(p.status==='waiting')appendEvent(run,p,p.start+1,'checkpoint','Approval required for candidate R43, evidence E43, policy P1, action create draft PR.');else appendEvent(run,p,run.elapsed,'output','Updating the saved-list panel and its empty state.');}
function nowTick(){return viewFrozen?frozenTick:tick;}function elapsed(run){return run.elapsed+(run.status==='running'?nowTick()*2:0);}function records(run,p){return outputRecords.filter(e=>e.run===run.id&&(!p||e.phase===p.id)&&e.tick<=nowTick());}
function parseRoute(){const params=new URLSearchParams(location.hash.slice(1));runId=params.get('run')||runs[0].id;phaseId=params.get('phase');view=params.has('run')?'run':'index';if(!runs.some(r=>r.id===runId)){runId=runs[0].id;view='index';}const run=runs.find(r=>r.id===runId);if(phaseId&&!run.phases.some(p=>p.id===phaseId))phaseId=null;render();}
function href(run,p){return '#run='+run.id+(p?'&phase='+p.id:'');}
function render(){const run=runs.find(r=>r.id===runId);$('breadcrumb').innerHTML=`<a class="brand" href="#">Factory observatory</a><span>/</span><a href="#">Runs</a>${view==='run'?`<span>/</span><a href="${href(run)}">${run.id}</a>${phaseId?`<span>/</span><span>${esc(phaseId)}</span>`:''}`:''}`;$('liveState').innerHTML=viewFrozen?'View frozen · recording continues':'<span class="live-dot"></span>Live · saved event '+(seq);$('notesCount').textContent=notes.length;
 $('main').innerHTML=view==='index'?indexView():runView(run);if(view==='run'&&phaseId)renderEvents();}
function viewControls(){return `<button id="freeze" aria-pressed="${viewFrozen}">${viewFrozen?'Follow latest events':'Freeze this view'}</button><small>${viewFrozen?'Viewing an earlier saved snapshot.':'Synthetic updates every 2 seconds.'} This changes the view only.</small>`;}
function indexView(){return `<section class="tools"><div><h1>Repository runs</h1><p class="muted">acme / storefront · ${runs.length} runs · 1 recording live activity</p></div><div class="wrap">${viewControls()}</div></section><div class="tools"><div class="wrap"><label>Find a run <input id="search" type="search" value="${esc(query)}" placeholder="Request, workflow, or ID"></label><label>Status <select id="statusFilter">${['all','running','waiting','interrupted','passed'].map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s==='all'?'All statuses':s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></label></div><small>Open a card to inspect its full timeline.</small></div><div class="cards" id="cards">${cards()}</div><p class="footnote">Every workflow supplies its own scopes, tasks, and sessions. No fixed plan/build/review pipeline. Unknown cost or token counts remain unknown.</p>`;}
function cards(){const matches=runs.filter(r=>(statusFilter==='all'||r.status===statusFilter)&&`${r.title} ${r.recipe} ${r.id}`.toLowerCase().includes(query.toLowerCase()));return matches.map(run=>`<article class="run-card ${run.status==='running'?'active':''}"><div class="card-head"><a href="${href(run)}">${esc(run.title)}</a><div class="recipe">${esc(run.recipe)} · ${run.id}</div><p title="${esc(run.request)}">${esc(run.request)}</p></div><div class="mini" id="mini-${run.id}">${mini(run)}</div><div class="card-foot"><div class="wrap between">${tag(run.status)}<small>${run.start}</small></div><div class="wrap" style="margin-top:10px"><span class="stat">Elapsed <span data-elapsed="${run.id}">${duration(elapsed(run))}</span></span><span class="stat">Cost unknown</span><span class="stat">Tokens unknown</span></div><small>${run.status==='waiting'?'Durable checkpoint saved. Runner exited.':run.status==='interrupted'?'No automatic restart. CLI Continue requires reconciliation.':run.status==='running'?'Two implementation task lanes; live output from the UI task.':'Retained events and evidence available.'}</small></div></article>`).join('')||'<p class="empty">No runs match these view filters.</p>';}
function mini(run){const owners=run.owners.filter(o=>run.phases.some(p=>p.owner===o[0]&&p.start!==null)).slice(0,4),end=elapsed(run);return `<div class="mini-axis"><span>0s</span><span>${duration(Math.floor(end/2))}</span><span>${duration(end)}</span></div>${owners.map(o=>`<div class="mini-row"><span title="${esc(o[1])}">${esc(o[1].split(' / ')[0])}</span><div class="mini-track">${records(run).filter(e=>run.phases.find(p=>p.id===e.phase).owner===o[0]).map(e=>`<i class="mark ${e.kind==='phase_start'?'start':e.kind==='phase_end'?'end':''}" title="${esc(e.kind)} at ${duration(e.time)}" style="left:${Math.min(97,e.time/end*97)}%"></i>`).join('')}</div></div>`).join('')}${run.owners.length>4?`<div class="mini-empty">+ ${run.owners.length-4} more lanes in run details</div>`:''}`;}
function runView(run){return `<section class="run-head"><div><h1>${esc(run.title)}</h1><p>${esc(run.request)}</p><div class="wrap metrics">${tag(run.status)}<span class="stat">${run.recipe}</span><span class="stat">Started ${run.start}</span><span class="stat">Elapsed <span data-elapsed="${run.id}">${duration(elapsed(run))}</span></span><span class="stat">Cost / tokens unknown</span></div></div><button id="commentRun">Comment on this view</button></section>${run.status==='waiting'?'<div class="notice"><strong>Waiting for a durable checkpoint response.</strong> Candidate R43 and evidence E43 are ready for inspection. Respond through a CLI command; this page cannot grant approval. The runner has exited. Saving an answer does not Continue the run.</div>':run.status==='interrupted'?'<div class="notice"><strong>Run interrupted.</strong> Changes and recorded evidence remain available. Use a foreground Continue command to reconcile the previous invocation. Opening this page never restarts work.</div>':'<p class="muted">Select a phase to inspect its request, effective configuration, events, and outputs. Phase names and lanes come from this workflow.</p>'}<section class="surface"><div class="section-head"><h2>Run timeline</h2><div class="wrap">${viewControls()}</div></div><div id="timeline" class="timeline-scroll">${timeline(run)}</div><div class="legend"><span>Purple dot: phase start</span><span>Cyan marks: observed events</span><span>Green dot: completed phase</span><span>Activity marks are events, not percent complete.</span></div></section>${phaseId?phaseDetails(run,run.phases.find(p=>p.id===phaseId)):'<div class="empty">Choose a phase above. The full timeline stays visible while you inspect it.</div>'}<p class="footnote">Read-only projection of saved events. Model thinking, unreported tool calls, and missing usage are not fabricated. This prototype has no backend or executable CLI.</p>`;}
function timeline(run){const end=elapsed(run);return `<div class="timeline"><div class="axis"><span>Owner / scope</span><div class="ticks"><span>0s</span><span>${duration(Math.round(end/4))}</span><span>${duration(Math.round(end/2))}</span><span>${duration(Math.round(end*3/4))}</span><span>${duration(end)}</span></div></div>${run.owners.map(o=>{const phases=run.phases.filter(p=>p.owner===o[0]);return `<div class="lane"><div class="owner"><strong>${esc(o[1])}</strong><small>${esc(o[2])}</small><small>${o[0]==='code'?'No agent session':'Usage and context: unknown'}</small></div><div class="lane-track">${phases.map(p=>p.start===null?`<div class="future">${tag(p.status)} ${esc(p.title)}${p.status==='declared'?' · start and duration unknown':''}</div>`:`<a href="${href(run,p)}" class="phase ${p.color} ${phaseId===p.id?'selected':''}" style="left:${p.start/end*98}%;width:${Math.max(2,(Math.min(p.end??end,end)-p.start)/end*98)}%" title="${esc(p.title)}: ${p.status}; ${duration((p.end??end)-p.start)}" aria-label="${esc(p.title)}, ${p.status}, inspect phase"><strong>${esc(p.title)}</strong><small>${p.status} · ${duration((p.end??end)-p.start)}</small><div class="activity-stripe" aria-hidden="true">${records(run,p).map(()=>'<i></i>').join('')}</div></a>`).join('')}</div></div>`;}).join('')}</div>`;}
function phaseDetails(run,p){const owner=run.owners.find(o=>o[0]===p.owner),agent=!['code','request','human'].includes(p.owner),hasOutput=p.end!==null&&p.status!=='interrupted';return `<section class="surface" id="phaseDetails"><div class="section-head"><div class="wrap"><h2>${esc(p.title)}</h2>${tag(p.status)}</div><div class="wrap"><span class="stat">Owner ${p.owner}</span><span class="stat">${agent?'Agent session':p.owner==='human'?'Checkpoint':'Managed operation'}</span><span class="stat">Attempt ${p.attempt||1}</span><a href="${href(run)}">Close details</a></div></div><div class="detail-grid"><div class="context"><details open><summary>Request and inputs</summary><p>${esc(run.request)}</p><dl class="facts"><dt>Phase intent</dt><dd>${esc(p.title)}</dd><dt>Input revision</dt><dd>${run.id==='run-051'&&p.id==='review-1'?'R42 (historical)':run.id==='run-051'?'R43':'Recorded task starting snapshot'}</dd><dt>Identity</dt><dd>${run.id} / ${p.id} / attempt-${p.attempt||1}</dd></dl></details><details open><summary>Effective configuration</summary><dl class="facts"><dt>Harness</dt><dd>${agent?esc(owner[2].split(' · ')[0]):'Not applicable'}</dd><dt>Model</dt><dd>${agent?'Pinned profile identifier (illustrative)':'Not applicable'}</dd><dt>Reasoning</dt><dd>${agent?esc(owner[2].split(' · ')[1]||'Profile-defined'):'Not applicable'}</dd><dt>Prompt</dt><dd>${agent?'Selected step prompt; replacement precedence applied':'Recorded command/input'}</dd><dt>Skills</dt><dd>${agent?'Repository conventions; native delivery requested; observed loading unknown':'Not applicable'}</dd><dt>Overrides</dt><dd>Repo defaults, then profile, then step. No targeted CLI override.</dd><dt>Worktree</dt><dd>Isolated scope workspace where required</dd></dl></details><details><summary>Compiled instructions</summary><p>Example saved instruction: work only on this phase's objective and return its configured result. Required review verdicts use a result schema.</p><p class="muted">Product view would show exact retained instructions after redaction. This fixture does not contain a real compiled prompt.</p></details><details><summary>Gates and repair policy</summary><p>${p.status==='failed'?'Blocking criterion failed. This attempt remains failed even after a later repair passes.':'Required check results and acceptance-criterion evidence belong to the recorded candidate.'}</p><p>Maximum 2 code repairs per loop; 20 additional agent attempts per run. Continue does not reset these counters.</p></details><details><summary>Usage</summary><p>Cost, tokens, and context utilization: unknown. Missing telemetry is not zero usage.</p></details><details ${hasOutput?'open':''}><summary>Outputs (${hasOutput?'1':'0'})</summary>${hasOutput?`<p><a href="#" id="openArtifact">Retained result report · attempt ${p.attempt||1}</a></p><p class="muted">Immutable evidence for this attempt, not the current contents of a working file.</p>`:'<p>No registered output for this phase yet.</p>'}</details></div><div class="event-pane"><div class="wrap between"><h3 id="eventsTitle">Recorded events</h3><small>Oldest first · saved before display</small></div><div id="eventList" class="event-list"></div><p class="footnote">${p.status==='running'?'New output is appended while this phase runs. Scrolling up stops automatic scrolling, not recording.':'Past attempts remain independently inspectable.'}</p></div></div></section>`;}
function renderEvents(){if(view!=='run'||!phaseId)return;const run=runs.find(r=>r.id===runId),p=run.phases.find(p=>p.id===phaseId),list=$('eventList');if(!list)return;const atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<40;const rows=records(run,p);$('eventsTitle').textContent=`Recorded events (${rows.length})`;list.innerHTML=rows.map(e=>`<article class="event-row"><time>${duration(e.time)}</time><span class="kind">${esc(e.kind)}</span><p>${esc(e.message)} <small>#${e.seq}</small></p></article>`).join('')||'<p class="empty">No saved events. Declared work has not started.</p>';if(atBottom)list.scrollTop=list.scrollHeight;}
function updateStream(){tick++;const run=runs[0],p=run.phases.find(p=>p.id==='panel');const messages=['Updating the empty-state component.','Adding a list item interaction.','Checking ownership handling in the UI.','Inspecting the recorded task acceptance criteria.','Preparing the task result summary.'];outputRecords.push({seq:++seq,run:run.id,phase:p.id,time:run.elapsed+tick*2,kind:'output',message:messages[(tick-1)%messages.length]+' (simulated)',tick});if(viewFrozen)return;$('liveState').innerHTML='<span class="live-dot"></span>Live · saved event '+seq;for(const el of document.querySelectorAll('[data-elapsed]')){const r=runs.find(r=>r.id===el.dataset.elapsed);el.textContent=duration(elapsed(r));}if(view==='index'){const miniEl=$('mini-'+run.id);if(miniEl)miniEl.innerHTML=mini(run);}else if(runId===run.id){const x=$('timeline').scrollLeft;$('timeline').innerHTML=timeline(run);$('timeline').scrollLeft=x;renderEvents();}}
function openNotes(){const run=runs.find(r=>r.id===runId);$('noteContext').textContent=view==='index'?'run index':`${run.id} / ${phaseId||'run timeline'}`;$('notesList').innerHTML=notes.map(n=>`<article class="note"><small>${esc(n.context)}</small><p>${esc(n.text)}</p></article>`).join('');$('notesDialog').showModal();$('note').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.id==='freeze'){viewFrozen=!viewFrozen;if(viewFrozen)frozenTick=tick;render();}if(b.id==='commentRun'||b.id==='notesButton')openNotes();if(b.id==='openArtifact'){e.preventDefault();const run=runs.find(r=>r.id===runId),p=run.phases.find(p=>p.id===phaseId);alert(`Illustrative retained report\n${run.id} / ${p.id}\nOutcome: ${p.status}\nThis is fixture content, not the output of an actual check.`);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('cards').innerHTML=cards();}});document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){statusFilter=e.target.value;$('cards').innerHTML=cards();}});
$('closeNotes').onclick=()=>$('notesDialog').close();$('saveNote').onclick=()=>{const text=$('note').value.trim();if(!text)return;notes.push({context:$('noteContext').textContent,text,time:new Date().toISOString()});try{localStorage.setItem('factory-observatory-review-v1',JSON.stringify(notes));}catch{$('announce').textContent='Storage unavailable. Export notes before leaving.';}$('note').value='';$('notesCount').textContent=notes.length;$('notesDialog').close();};$('exportNotes').onclick=()=>{const data='# Observability prototype review\n\n'+notes.map(n=>`## ${n.context}\n\n${n.text}\n`).join('\n');const url=URL.createObjectURL(new Blob([data],{type:'text/markdown'}));const a=document.createElement('a');a.href=url;a.download='observability-review.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
window.addEventListener('hashchange',()=>{parseRoute();if(phaseId)$('phaseDetails')?.scrollIntoView({block:'start'});else scrollTo(0,0);});parseRoute();setInterval(updateStream,2000);
</script></body></html>
