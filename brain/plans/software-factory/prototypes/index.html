$('export-md').addEventListener('click',()=>{const body=notes.map(n=>`## ${n.design} / ${n.anchor}\n\n${n.type} by ${n.reviewer||'Reviewer'} (${n.resolved?'resolved':'open'})\n\n${n.quote?'> '+n.quote.replace(/\n/g,'\n> ')+'\n\n':''}${n.body}\n`).join('\n');download('factory-feedback.md','# Software factory feedback\n\n'+body,'text/markdown');$('storage-status').textContent='Feedback Markdown exported. Share this file with the chat.';});
$('show-import').addEventListener('click',()=>{const panel=$('import-panel');panel.hidden=!panel.hidden;$('show-import').setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)$('import-text').focus();});
$('import-notes').addEventListener('click',()=>{try{const raw=$('import-text').value;if(raw.length>2000000)throw new Error('File is too large.');const data=JSON.parse(raw);if(data.version!==1||!Array.isArray(data.notes)||data.notes.length>1000||!data.notes.every(validNote))throw new Error('Expected version 1 feedback with valid notes.');let count=0;const changed=[];for(const incoming of data.notes){const n=Object.fromEntries(['id','design','anchor','quote','body','reviewer','type','created','updated','resolved'].map(k=>[k,incoming[k]]));const i=notes.findIndex(old=>old.id===n.id);if(i<0){notes.push(n);changed.push(n);count++}else if(n.updated>notes[i].updated){notes[i]=n;changed.push(n);count++}}save(changed);$('import-status').textContent=`Merged ${count} new or updated notes. Duplicates were preserved once.`;$('import-status').classList.remove('error')}catch(error){$('import-status').textContent='Import failed: '+error.message;$('import-status').classList.add('error')}});
$('show-resolved').addEventListener('change',renderNotes);
window.addEventListener('storage',e=>{if(e.key===storeKey||e.key?.startsWith(notePrefix)){try{notes=mergeRecords([...notes,...readStoredNotes()]);renderNotes()}catch{storageOK=false}}});
</script>
</body>
</html>
